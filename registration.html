<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration – Immersive Heritage 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-950 text-white">

    <!-- Navigation Bar -->
    <header class="bg-gray-950 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Immersive Heritage</h1>
            <nav class="space-x-4">
                <a href="index.html" class="hover:text-yellow-400 transition">Home</a>
                <a href="committees.html" class="hover:text-yellow-400 transition">Committees</a>
                <a href="registration.html" class="text-yellow-400 font-semibold">Registration</a>
                <a href="sponsors.html" class="hover:text-yellow-400 transition">Sponsors</a>
                <a href="contact.html" class="hover:text-yellow-400 transition">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Registration Form -->
    <section class="py-16 px-6 max-w-xl mx-auto">
        <h2 class="text-3xl font-bold mb-8 text-center text-yellow-400">Register for the Event</h2>

        <form class="space-y-6 bg-gray-900 p-8 rounded-lg shadow-md">
            <div>
                <label for="lastname" class="block text-sm font-medium text-white mb-1">Last Name</label>
                <input type="text" id="lastname" name="lastname"
                    class="w-full px-4 py-2 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                    required>
            </div>

            <div>
                <label for="firstname" class="block text-sm font-medium text-white mb-1">First Name</label>
                <input type="text" id="firstname" name="firstname" 
                    class="w-full px-4 py-2 rounded bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                    required>
            </div>

            <div class="text-center">
                <button type="submit"
                    class="bg-yellow-400 text-black font-semibold px-6 py-2 rounded-full hover:bg-yellow-300 transition">Submit</button>
            </div>
        </form>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-950 py-8 px-6 text-center text-gray-500 text-sm border-t border-gray-800">
        <p>&copy; 2026 Immersive Heritage. All rights reserved.</p>
    </footer>

</body>

</html>
